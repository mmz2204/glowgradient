<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>VaultGlow - Advanced Secure Password Generator</title>
  <meta name="description" content="Generate military-grade, custom random passwords locally with VaultGlow. Features a real-time security strength meter, similar character exclusion, and zero-server data leaks. Fully secure and ad-free.">
  <meta name="keywords" content="vaultglow, secure password generator, random password creator, advanced password tool, generate strong password, privacy enthusiast tools, local password generator, ad-free password tool">

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
    .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center p-6 overflow-hidden select-none">

  <header class="w-full max-w-4xl flex justify-between items-center border-b border-gray-800/50 pb-4">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <span class="text-xl font-bold tracking-wider bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">VaultGlow</span>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/20 font-mono">v1.0 Pro</span>
    </div>
    <div class="text-xs text-gray-500 font-mono">Status: Military Grade Security</div>
  </header>

  <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6 my-auto">
    
    <section class="glass rounded-2xl p-6 flex flex-col justify-between space-y-4">
      <div class="flex items-center gap-2 text-emerald-400 font-semibold text-lg border-b border-gray-800 pb-2">
        <span>⚙️</span> Custom Settings
      </div>

      <div class="space-y-2">
        <div class="flex justify-between text-sm font-mono">
          <span class="text-gray-400">Password Length:</span>
          <span id="lengthVal" class="text-emerald-400 font-bold text-base">16</span>
        </div>
        <input type="range" id="lengthSlider" min="8" max="64" value="16" class="w-full h-2 bg-gray-800 rounded-lg appearance-none cursor-pointer accent-emerald-400">
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer hover:text-white">
          <input type="checkbox" id="incUppercase" checked class="w-4 h-4 accent-emerald-400 rounded"> ABC (Uppercase)
        </label>
        <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer hover:text-white">
          <input type="checkbox" id="incLowercase" checked class="w-4 h-4 accent-emerald-400 rounded"> abc (Lowercase)
        </label>
        <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer hover:text-white">
          <input type="checkbox" id="incNumbers" checked class="w-4 h-4 accent-emerald-400 rounded"> 123 (Numbers)
        </label>
        <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer hover:text-white">
          <input type="checkbox" id="incSymbols" checked class="w-4 h-4 accent-emerald-400 rounded"> #$& (Symbols)
        </label>
      </div>

      <div class="border-t border-gray-800/80 pt-4 space-y-2">
        <label class="flex items-center justify-between text-sm text-gray-400 cursor-pointer hover:text-white">
          <span class="flex flex-col">
            <span>Exclude Similar Characters</span>
            <span class="text-xs text-gray-600 font-mono">(e.g. i, l, 1, L, o, 0, O)</span>
          </span>
          <input type="checkbox" id="excSimilar" class="w-4 h-4 accent-emerald-400 rounded">
        </label>
      </div>
    </section>

    <section class="glass rounded-2xl p-6 flex flex-col justify-between space-y-6">
      <div class="flex items-center gap-2 text-cyan-400 font-semibold text-lg border-b border-gray-800 pb-2">
        <span>🔒</span> Secure Output
      </div>

      <div class="relative bg-slate-950/60 border border-gray-800 rounded-xl p-4 min-h-[70px] flex items-center justify-center break-all font-mono text-lg text-emerald-300 text-center tracking-wider select-text">
        <span id="passwordDisplay">Loading...</span>
      </div>

      <div class="space-y-2">
        <div class="flex justify-between text-xs font-mono">
          <span class="text-gray-500">Security Strength:</span>
          <span id="strengthText" class="font-bold text-emerald-400 uppercase tracking-widest">STRONG</span>
        </div>
        <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
          <div id="strengthBar" class="bg-emerald-400 h-full w-3/4 transition-all duration-300"></div>
        </div>
      </div>

      <button id="copyBtn" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-emerald-500/10 active:scale-[0.98] transition-all cursor-pointer flex items-center justify-center gap-2 text-base">
        📋 Copy Password
      </button>
    </section>
  </main>

  <footer class="w-full max-w-4xl flex justify-between items-center border-t border-gray-800/50 pt-4 text-xs text-gray-600 font-mono">
    <div>© 2026 VaultGlow. Localized Privacy.</div>
    <div class="flex items-center gap-2">
      <span class="text-gray-500">☕ Buy me a coffee via PayPal:</span>
      <strong class="text-cyan-400 font-bold select-all cursor-pointer hover:text-cyan-300" title="Click to select all">393497238@qq.com</strong>
    </div>
  </footer>

  <script>
    const lengthSlider = document.getElementById('lengthSlider');
    const lengthVal = document.getElementById('lengthVal');
    const passwordDisplay = document.getElementById('passwordDisplay');
    const strengthText = document.getElementById('strengthText');
    const strengthBar = document.getElementById('strengthBar');
    const copyBtn = document.getElementById('copyBtn');

    const uppers = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const lowers = 'abcdefghijklmnopqrstuvwxyz';
    const numbers = '0123456789';
    const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
    const similars = /[il1Lo0O]/g;

    function generatePassword() {
      let pool = '';
      if(document.getElementById('incUppercase').checked) pool += uppers;
      if(document.getElementById('incLowercase').checked) pool += lowers;
      if(document.getElementById('incNumbers').checked) pool += numbers;
      if(document.getElementById('incSymbols').checked) pool += symbols;

      if(document.getElementById('excSimilar').checked) {
        pool = pool.replace(similars, '');
      }

      const len = parseInt(lengthSlider.value);
      if(!pool) {
        passwordDisplay.innerText = '⚠️ Select Option';
        updateStrength(0);
        return;
      }

      let password = '';
      for(let i = 0; i < len; i++) {
        password += pool.charAt(Math.floor(Math.random() * pool.length));
      }
      passwordDisplay.innerText = password;
      calculateStrength(password, len);
    }

    function calculateStrength(pwd, len) {
      let score = 0;
      if(len >= 12) score++;
      if(len >= 18) score++;
      if(/[A-Z]/.test(pwd)) score++;
      if(/[0-9]/.test(pwd)) score++;
      if(/[^A-Za-z0-9]/.test(pwd)) score++;

      updateStrength(score);
    }

    function updateStrength(score) {
      if(score <= 2) {
        strengthText.innerText = 'WEAK';
        strengthText.className = 'font-bold text-red-500 uppercase tracking-widest';
        strengthBar.className = 'bg-red-500 h-full transition-all duration-300';
        strengthBar.style.width = '25%';
      } else if(score <= 4) {
        strengthText.innerText = 'MEDIUM';
        strengthText.className = 'font-bold text-amber-500 uppercase tracking-widest';
        strengthBar.className = 'bg-amber-500 h-full transition-all duration-300';
        strengthBar.style.width = '60%';
      } else {
        strengthText.innerText = 'STRONG';
        strengthText.className = 'font-bold text-emerald-400 uppercase tracking-widest';
        strengthBar.className = 'bg-emerald-400 h-full transition-all duration-300';
        strengthBar.style.width = '100%';
      }
    }

    // 事件监听
    lengthSlider.addEventListener('input', (e) => {
      lengthVal.innerText = e.target.value;
      generatePassword();
    });

    document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', generatePassword);
    });

    copyBtn.addEventListener('click', () => {
      const pwd = passwordDisplay.innerText;
      if(pwd && pwd !== '⚠️ Select Option' && pwd !== 'Loading...') {
        navigator.clipboard.writeText(pwd);
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = '✅ Copied!';
        copyBtn.style.opacity = '0.9';
        setTimeout(() => {
          copyBtn.innerHTML = originalText;
          copyBtn.style.opacity = '1';
        }, 1500);
      }
    });

    // 页面加载自动触发一次生成
    generatePassword();
  </script>
</body>
</html>
