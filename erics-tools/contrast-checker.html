<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contrast Checker — Eric's Tools</title>
  <meta name="description" content="WCAG contrast ratio checker. Test foreground/background color combinations.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23080c14'/><text x='16' y='22' text-anchor='middle' font-size='16' font-family='system-ui,sans-serif' font-weight='900' fill='%2322d3ee'>C</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body{background:#080c14;color:#f3f4f6}
    .glass{background:rgba(15,23,42,0.4);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.03)}
    .input-field{background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.07);color:#f3f4f6;font-family:monospace}
    .input-field:focus{outline:none;border-color:rgba(34,211,238,0.4);box-shadow:0 0 0 3px rgba(34,211,238,0.08)}
    .result-badge{font-size:13px;font-weight:600;padding:4px 12px;border-radius:6px}
    .pass-aaa{background:rgba(34,197,94,0.15);color:#22c55e}
    .pass-aa{background:rgba(34,211,238,0.15);color:#22d3ee}
    .fail{background:rgba(239,68,68,0.15);color:#ef4444}
  </style>
</head>
<body class="min-h-screen w-screen flex flex-col items-center p-6 md:p-12">

  <header class="w-full max-w-2xl mb-8">
    <a href="index.html" class="text-xs font-mono text-cyan-400 hover:text-cyan-300">← Back to Eric's Tools</a>
    <h1 class="text-3xl md:text-4xl font-black mt-4 tracking-tight bg-gradient-to-r from-white via-gray-200 to-gray-500 bg-clip-text text-transparent">Contrast Checker</h1>
    <p class="text-gray-400 text-sm mt-2">WCAG 2.1 contrast ratio checker. Enter colors and see pass/fail instantly.</p>
  </header>

  <main class="w-full max-w-2xl space-y-6">

    <!-- Preview -->
    <div id="preview" class="glass rounded-2xl p-10 text-center transition-all" style="background:rgba(15,23,42,0.6)">
      <p id="preview-text" class="text-2xl font-black" style="color:#ffffff">Sample Text</p>
      <p id="preview-sub" class="text-sm mt-1" style="color:#cccccc">The quick brown fox jumps over the lazy dog.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="glass rounded-2xl p-5 space-y-3">
        <label class="text-xs font-mono text-gray-400">Foreground Color</label>
        <div class="flex gap-3 items-center">
          <input type="color" id="fg-picker" value="#ffffff" class="w-10 h-10 rounded-lg cursor-pointer border-0 p-0" style="background:transparent">
          <input id="fg-hex" type="text" value="#FFFFFF" maxlength="7" class="input-field flex-1 p-2.5 rounded-lg text-sm" oninput="updateFromHex('fg')">
        </div>
      </div>
      <div class="glass rounded-2xl p-5 space-y-3">
        <label class="text-xs font-mono text-gray-400">Background Color</label>
        <div class="flex gap-3 items-center">
          <input type="color" id="bg-picker" value="#080c14" class="w-10 h-10 rounded-lg cursor-pointer border-0 p-0" style="background:transparent">
          <input id="bg-hex" type="text" value="#080C14" maxlength="7" class="input-field flex-1 p-2.5 rounded-lg text-sm" oninput="updateFromHex('bg')">
        </div>
      </div>
    </div>

    <div class="glass rounded-2xl p-6 space-y-4 text-center">
      <div>
        <p class="text-xs font-mono text-gray-400 mb-1">Contrast Ratio</p>
        <p id="ratio" class="text-4xl font-black text-cyan-400">21.00</p>
      </div>
      <div class="flex justify-center gap-4 flex-wrap">
        <div id="aa-normal" class="result-badge">AA Normal</div>
        <div id="aa-large" class="result-badge">AA Large</div>
        <div id="aaa-normal" class="result-badge">AAA Normal</div>
        <div id="aaa-large" class="result-badge">AAA Large</div>
      </div>
    </div>

  </main>

  <script>
    const fgPicker = document.getElementById("fg-picker");
    const bgPicker = document.getElementById("bg-picker");
    const fgHex = document.getElementById("fg-hex");
    const bgHex = document.getElementById("bg-hex");

    function hexToRgb(hex) {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      if (!m) return null;
      return { r: parseInt(m[1],16), g: parseInt(m[2],16), b: parseInt(m[3],16) };
    }

    function relativeLuminance({r,g,b}) {
      const c = [r,g,b].map(v => { v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); });
      return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
    }

    function contrastRatio(fg, bg) {
      const l1 = relativeLuminance(fg), l2 = relativeLuminance(bg);
      const lighter = Math.max(l1, l2), darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function update() {
      const fg = hexToRgb(fgHex.value);
      const bg = hexToRgb(bgHex.value);
      if (!fg || !bg) return;

      const ratio = contrastRatio(fg, bg);
      document.getElementById("ratio").textContent = ratio.toFixed(2);
      document.getElementById("preview-text").style.color = fgHex.value;
      document.getElementById("preview-sub").style.color = fgHex.value;
      document.getElementById("preview").style.backgroundColor = bgHex.value;

      const cls = (v, pass, fail) => v ? pass : fail;
      const setBadge = (id, pass) => {
        const el = document.getElementById(id);
        el.className = "result-badge " + (pass ? "pass-aaa" : "fail");
        el.textContent = el.textContent.replace(/ [✓✗]$/, "") + (pass ? " ✓" : " ✗");
      };

      setBadge("aa-normal", ratio >= 4.5);
      setBadge("aa-large", ratio >= 3);
      setBadge("aaa-normal", ratio >= 7);
      setBadge("aaa-large", ratio >= 4.5);
    }

    function updateFromHex(which) {
      const input = which === "fg" ? fgHex : bgHex;
      const picker = which === "fg" ? fgPicker : bgPicker;
      let val = input.value;
      if (!val.startsWith("#")) val = "#" + val;
      if (/^#[0-9a-fA-F]{6}$/.test(val)) {
        picker.value = val;
        if (which === "fg") fgHex.value = val.toUpperCase(); else bgHex.value = val.toUpperCase();
        update();
      }
    }

    fgPicker.addEventListener("input", () => { fgHex.value = fgPicker.value.toUpperCase(); update(); });
    bgPicker.addEventListener("input", () => { bgHex.value = bgPicker.value.toUpperCase(); update(); });

    // Init
    fgPicker.value = "#FFFFFF";
    bgPicker.value = "#080C14";
    update();
  </script>
</body>
</html>
